# Mosaix Format v1.0 — CORE frontmatter keys (§3.1)
# Required for conformance unless marked optional.
keys:
  - key: title
    type: string
    constraint: basename of the file if omitted; checker skips if absent
    default: ~
    required: false

  - key: updated
    type: date  # YYYY-MM-DD
    constraint: last substantive change; drives staleness
    default: ~
    required: true

  - key: tags
    type: list of strings
    constraint: each value must appear in the meta note taxonomy
    default: ~
    required: true

  - key: summary
    type: string
    constraint: 120–240 characters; must not repeat the title; must not begin with "This note…"
    default: ~
    required: true

  - key: keywords
    type: list of strings
    constraint: 6–8 items; must not duplicate tags
    default: ~
    required: true

  - key: entities
    type: list of {name, type}
    constraint: at most 12 items; type must be one of the allowed entity types (§3.1)
    default: []
    required: false  # contributes to the 80% coverage check

  - key: relations
    type: list of {from, type, to}
    constraint: type is a short verb phrase; must be from relation_types if that list is declared
    default: []
    required: false

  - key: links
    type: list of strings
    constraint: each value must resolve to an existing note
    default: []
    required: false

  - key: rev
    type: string  # 12 hex characters
    constraint: sha256(body)[:12] at the time entities/relations/links were last computed
    default: ~
    required: true

# Canonical key order (§3.1): title · updated · [domain keys] · summary · keywords · entities · relations · links · rev
