<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mosaix — OG image (1200×630)</title>
<link rel="stylesheet" href="fonts/plex.css">
<style>
  body{margin:0;background:#666}
  .og{width:1200px;height:630px;background:#efeae0;color:#14130f;position:relative;overflow:hidden;font-family:"IBM Plex Sans",system-ui,sans-serif;margin:20px auto}
  .mark{position:absolute;right:80px;top:95px;width:440px;height:440px}
  .txt{position:absolute;left:80px;top:110px;width:600px}
  .kick{font:14px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#7d786c;margin-bottom:28px}
  h1{font:600 64px/1.02 "IBM Plex Sans",sans-serif;letter-spacing:-.03em;margin:0 0 22px}
  .q{font:italic 26px/1.35 "IBM Plex Serif",serif;color:#4a4741;padding-left:18px;border-left:4px solid #c9a227;margin:0}
  .foot{position:absolute;left:80px;bottom:56px;font:15px "IBM Plex Mono",monospace;color:#7d786c}
</style>
</head>
<body>
<!-- Export: screenshot this element at 1200×630 → og.png. Static, no animation. -->
<div class="og">
  <div class="txt">
    <div class="kick">Mosaix Format · v1.0 · open</div>
    <h1>Every note is a tile that stands on its own.</h1>
    <p class="q">The picture exists only in the whole.</p>
  </div>
  <svg class="mark" viewBox="0 0 100 100"><g fill="#14130f"><polygon transform="translate(31 31) rotate(41)" points="-15,-13 13,-15 15,13 -13,15"/><polygon transform="translate(69 30) rotate(47)" points="-12,-13 13,-12 12,13 -13,12"/><polygon transform="translate(30 69) rotate(44)" points="-13,-12 12,-13 13,12 -12,13"/></g><polygon transform="translate(70 70) rotate(49)" points="-14,-14 14,-13 13,14 -14,13" fill="none" stroke="#14130f" stroke-width="4"/></svg>
  <div class="foot">mosaixformat.org · a file-level format for knowledge vaults · CC BY-SA 4.0</div>
</div>
</body>
</html>
