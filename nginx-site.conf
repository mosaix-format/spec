server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Markdown files served as text/markdown
    location ~ \.md$ {
        default_type text/markdown;
        add_header X-Content-Type-Options nosniff;
    }

    # Cache: fonts immutable, everything else 1h
    location ~* \.woff2$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(html|css|js|svg|png|xml|txt|json)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA-style fallback not needed (pure static), but clean 404
    error_page 404 /404.html;
}
