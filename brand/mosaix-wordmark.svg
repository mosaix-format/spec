<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="440" height="100">
  <!-- Mosaix — wordmark: marchio (tre smalti pieni, uno aperto) + parola intera -->
  <g transform="translate(50 50) scale(0.8) translate(-50 -50)">
    <g fill="currentColor">
      <polygon transform="translate(31 31) rotate(41)" points="-15,-13 13,-15 15,13 -13,15"/>
      <polygon transform="translate(69 30) rotate(47)" points="-12,-13 13,-12 12,13 -13,12"/>
      <polygon transform="translate(30 69) rotate(44)" points="-13,-12 12,-13 13,12 -12,13"/>
    </g>
    <polygon transform="translate(70 70) rotate(49)" points="-14,-14 14,-13 13,14 -14,13"
             fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter"/>
  </g>
  <text x="112" y="72" fill="currentColor" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="70" letter-spacing="-1">mosaix</text>
</svg>
